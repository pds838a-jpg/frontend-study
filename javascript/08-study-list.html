<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>학습 목록</title><link rel="stylesheet" href="style.css"></head>
<body><a href="index.html">목록</a><main><h1>08. 학습 목록 추가·완료·삭제</h1>
<p>폼 이벤트와 DOM 생성·삭제를 함께 연습합니다. 새로고침하면 목록이 초기화됩니다.</p>
<form id="form"><label for="topic">학습 주제 (80자 이내)</label><input id="topic" maxlength="80" autocomplete="off"><button>추가</button></form>
<p id="status" role="status">0개</p><ul id="topics"></ul>
</main><script>
"use strict";
const input = document.querySelector("#topic");
const list = document.querySelector("#topics");
const status = document.querySelector("#status");
function updateCount() { status.textContent = `${list.children.length}개`; }
document.querySelector("#form").addEventListener("submit", (event) => {
  event.preventDefault();
  const value = input.value.trim();
  if (value === "") {
    status.textContent = "주제를 입력하세요.";
    input.focus();
    return;
  }
  const item = document.createElement("li");
  const text = document.createElement("span");
  text.textContent = value;
  const complete = document.createElement("button");
  complete.type = "button";
  complete.textContent = "완료";
  complete.setAttribute("aria-pressed", "false");
  complete.setAttribute("aria-label", `${value} 완료 전환`);
  complete.addEventListener("click", () => {
    const done = text.classList.toggle("done");
    complete.setAttribute("aria-pressed", String(done));
    complete.textContent = done ? "완료 취소" : "완료";
  });
  const remove = document.createElement("button");
  remove.type = "button";
  remove.textContent = "삭제";
  remove.setAttribute("aria-label", `${value} 삭제`);
  remove.addEventListener("click", () => {
    item.remove();
    updateCount();
    input.focus();
  });
  item.append(text, " ", complete, remove);
  list.append(item);
  input.value = "";
  updateCount();
  input.focus();
});
</script></body></html>
