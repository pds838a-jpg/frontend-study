<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>조건문</title><link rel="stylesheet" href="style.css"></head>
<body><a href="index.html">목록</a><main><h1>02. 조건문과 논리 연산</h1>
<form id="form" novalidate><label for="score">점수 (0~100 정수)</label><input id="score" type="number" value="80" min="0" max="100"><label for="subject">복습 과목</label><select id="subject"><option value="html">HTML</option><option value="css">CSS</option><option value="js">JavaScript</option></select><button>확인</button></form>
<pre id="output" aria-live="polite"></pre><p>확인: 59, 60, 79, 80, 100, 101, 빈 값을 비교합니다.</p>
</main><script>
"use strict";
document.querySelector("#form").addEventListener("submit", (event) => {
  event.preventDefault();
  const raw = document.querySelector("#score").value.trim();
  const score = Number(raw);
  const output = document.querySelector("#output");
  if (raw === "" || !Number.isInteger(score) || score < 0 || score > 100) {
    output.textContent = "0~100 사이의 정수를 입력하세요.";
    return;
  }
  let message;
  if (score >= 80) message = "다음 단계";
  else if (score >= 60) message = "한 번 더 복습";
  else message = "기초부터 복습";
  let topic;
  switch (document.querySelector("#subject").value) {
    case "html": topic = "문서 구조"; break;
    case "css": topic = "스타일과 배치"; break;
    default: topic = "동작과 데이터";
  }
  output.textContent = `${message}\n복습 주제: ${topic}\n60 이상 80 미만: ${score >= 60 && score < 80}\n엄격 비교 80 === '80': ${80 === "80"}`;
});
</script></body></html>
